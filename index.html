<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>to do list</title>
<!--    <link href="css/todolist.css" rel="stylesheet">-->
    <link href="css/todoliststyle.css" rel="stylesheet">
    <link rel="stylesheet" href="bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

</head>
<body>
<div class="container">
    <div class="row p-3">
        <div class="mx-auto w-50 mt-5" id="myform">
            <h5 class="text-primary mb-3">TODO LIST</h5>
            <form id="formItem" name="formitem">
            <p class="mb-0" id="itemp">Enter item</p>
           <input type="text" name="task" id="task" class="w-100 p-2"/>
                <p id="index-error" class="text-danger indexError"></p>
            <button class="btn btn-add p-3 mt-2" id="btn" type="submit">Add item</button>
            <button class="btn btn-danger p-2 mt-2" id="btnCancel" type="button" style="display: none">cancel</button>
            </form>
            <input type="text" name="filter" id="filter" class="w-100 mt-3 p-2" placeholder="filter item"/>
            <ul id="list" class="list mt-3" >
            </ul>
            <button class="allclear" id="claerAll">clear All</button>
        </div>
    </div>

</div>

<script rel="script" src="js/todolist.js"></script>
</body>
</html>
